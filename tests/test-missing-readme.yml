name: Test missing readme - no plugin readme present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no readme.txt exists at repo root
        run: |
          rm -f "$GITHUB_WORKSPACE/readme.txt"
          rm -f "$GITHUB_WORKSPACE/plugin/readme.txt"
          echo "No readme.txt present"
      - id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
        continue-on-error: true
      - name: Assert action ran (did not skip)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no readme.txt, the action should either succeed (no-op)
          # or fail with an API/readme error — but it must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
