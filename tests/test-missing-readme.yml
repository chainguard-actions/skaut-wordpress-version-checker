name: Test missing readme fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Point to a real public repo that has no WordPress plugin readme.txt
      GITHUB_REPOSITORY: actions/checkout
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: invalid-token-for-testing

      - name: Assert action failed due to missing readme
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when readme is missing, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when readme is missing"
