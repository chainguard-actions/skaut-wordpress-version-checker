name: Test - no WordPress readme found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure - no WordPress readme in this repo)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed with readme error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no WordPress readme is present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no WordPress readme was found"
