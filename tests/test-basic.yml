name: Test basic usage - repo-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ env.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Assert action was invoked with repo-token
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to no real GitHub context, but it must have been invoked
          # with the repo-token input. A missing required input would cause a different error.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with repo-token input"
