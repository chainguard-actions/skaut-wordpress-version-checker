name: Test basic usage with repo-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with repo-token input provided
        run: |
          echo "Action completed (outcome: ${{ steps.action.outcome }})"
          # The action requires a real GitHub context to create issues.
          # We verify it ran (not skipped) and the input was accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with repo-token input"
