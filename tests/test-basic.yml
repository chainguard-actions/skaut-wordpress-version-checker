name: Test basic usage with real token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WordPress version checker
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action completed (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action reads readme.txt from the repo via GitHub API.
          # Since this test repo is not a WordPress plugin, the action will
          # fail with "No readme file was found" — that is the expected behavior.
          # We assert the step completed (success or failure) but was not skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome: $OUTCOME"
