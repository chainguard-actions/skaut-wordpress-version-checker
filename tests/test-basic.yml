name: Test basic usage - action runs and handles missing readme gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WordPress version checker with real token
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (success or expected failure due to no readme)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action reads readme.txt from the real repo via GitHub API.
          # Since this test repo is not a WordPress plugin, it has no readme.txt,
          # so the action is expected to fail with "No readme file was found".
          # Either outcome (success or failure) is acceptable — what matters is
          # that the action ran and did not produce an unexpected crash (e.g. exit 2).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action ran and produced a known outcome: $OUTCOME"
          else
            echo "FAIL: Action produced unexpected outcome: $OUTCOME"
            exit 1
          fi
